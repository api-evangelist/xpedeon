name: Xpedeon
description: >-
  Xpedeon is a construction-specific ERP platform from Algorithms Software Pvt
  Ltd (30+ years in construction software), serving general contractors,
  specialist contractors, housebuilders and developers, engineer-to-order
  manufacturers, and off-site manufacturers across the UK, India, the GCC, and
  the US. The cloud platform covers construction finance and accounting, job
  costing and CVR, contract and subcontractor management, procurement,
  inventory and supply chain, plant and equipment, warehouse management, HR
  and payroll, CRM, and a mobile app for site teams, and is ISO 27001, 27017,
  27018, 27701 and SOC 2 certified. Xpedeon publishes no public API,
  developer portal, or integration documentation, but does publish an
  llms.txt. Backed by Norwest Venture Partners.
